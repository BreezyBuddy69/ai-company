name: Publish images to GHCR

# Builds the two images Docker Manager needs pre-built (it can't run `docker
# build` itself, only pull) and pushes them to ghcr.io on every push to
# master that touches backend/ or dashboard/. See docker-compose.hostinger.yml.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "dashboard/**"
      - "db/**"
      - "agents/**"
      - "skills/**"
      - "model_registry.yaml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ai-company-backend
            context: .
            dockerfile: backend/Dockerfile
          - name: ai-company-dashboard
            context: ./dashboard
            dockerfile: dashboard/Dockerfile
            # Same origin as the dashboard itself — Traefik routes /api on this
            # host to the backend (docker-compose.hostinger.yml). Must be baked
            # in: NEXT_PUBLIC_* is inlined into the client bundle at build time,
            # so setting it as a container env var at deploy time does nothing.
            build-args: |
              NEXT_PUBLIC_API_URL=https://factory.halovisionai.cloud
          - name: ai-company-postgres
            context: ./db
            dockerfile: db/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Per-image, empty for the two that take no args. The old
          # "target-agnostic image" approach relied on apiBase()'s
          # `<host>:47832` fallback, which is dead on this VPS — that port is
          # firewall-dropped, so the fallback could never reach the backend.
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ env.REGISTRY }}/breezybuddy69/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/breezybuddy69/${{ matrix.name }}:${{ github.sha }}
