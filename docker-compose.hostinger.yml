# Deploy for Hostinger's Docker Manager (paste this file's raw GitHub URL into
# its Compose-URL field — not the repo homepage).
#
# WHY THIS FILE NO LONGER PUBLISHES PORTS 47831-47834
# ---------------------------------------------------
# It used to, and that was unfixable on this host. Measured from outside on
# 2026-07-29: ports 47831-47834 time out, and so do arbitrary unused ports
# (12345, 54321), while 22/80/443 answer. That is a firewall DROP policy, not a
# dead container — the old "the ports are closed so the stack isn't running"
# reading was never supported by the evidence. Publishing a port the firewall
# discards buys nothing and leaves headless Chrome and Postgres exposed to
# anything already on the box.
#
# Traefik is already running on 80/443 (it serves n8n.halovisionai.cloud) and
# DNS for factory.halovisionai.cloud already resolves here. So everything is
# routed through Traefik instead, over HTTPS.
#
# SINGLE HOSTNAME, ON PURPOSE
# ---------------------------
# Dashboard and API share factory.halovisionai.cloud; /api goes to the backend,
# everything else to the dashboard. Same-origin means:
#   - no CORS and no fetch() preflight, which is what made Traefik basicauth
#     unusable on the old two-hostname layout (see dashboard/lib/api.ts)
#   - one basicauth covers the UI and the API, so the backend needs no API_KEY
#     and nothing secret is baked into the dashboard's JS bundle
#   - one certificate
# /health stays unauthenticated so uptime checks and curl can prove liveness.
#
# BEFORE DEPLOYING, EDIT IN THE DOCKER MANAGER UI
#   - POSTGRES_PASSWORD (3 places — postgres, backend, celery_worker, celery_beat)
#   - OPENROUTER_API_KEY (backend + celery_worker)
#   - BROWSERLESS_TOKEN (browserless + backend + celery_worker)
# Never commit real values here; this file is public.
#
# The dashboard image must be built with
# NEXT_PUBLIC_API_URL=https://factory.halovisionai.cloud — CI does this
# (.github/workflows/docker-publish.yml). An image built before that change
# falls back to `<host>:47832`, which the firewall drops, and every panel shows
# a network error. Pull :latest, don't reuse a cached older image.

services:
  postgres:
    image: ghcr.io/breezybuddy69/ai-company-postgres:latest
    container_name: factory-postgres
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
      POSTGRES_DB: factory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: factory-redis
    restart: unless-stopped
    networks:
      - internal
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 96m

  backend:
    image: ghcr.io/breezybuddy69/ai-company-backend:latest
    container_name: factory-backend
    restart: unless-stopped
    networks:
      - internal
      - traefik-proxy
    environment:
      DATABASE_URL: postgresql+psycopg://factory:CHANGE_ME_STRONG_PASSWORD@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      # Required before any agent can think (empty = agents no-op). Set a key
      # that has a spend limit — see docs/cost-limits.md. An unlimited key on
      # this stack has already cost real money once.
      OPENROUTER_API_KEY: ""
      # Deliberately blank: auth happens at Traefik (basicauth below), which
      # works here because the dashboard is same-origin. Setting this without
      # rebuilding the dashboard with a matching NEXT_PUBLIC_API_KEY is what
      # produced the `{"detail":"missing or invalid X-API-Key"}` on every tab.
      API_KEY: ""
      BROWSERLESS_URL: http://browserless:3000
      BROWSERLESS_TOKEN: "CHANGE_ME_STRONG_TOKEN"
    volumes:
      - agent_configs:/agents/configs
    depends_on:
      - postgres
      - redis
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.services.anvil-api.loadbalancer.server.port=8000
      # /api — authenticated. Explicit priority beats the dashboard catch-all
      # rather than relying on Traefik's rule-length tiebreak.
      - traefik.http.routers.anvil-api.rule=Host(`factory.halovisionai.cloud`) && PathPrefix(`/api`)
      - traefik.http.routers.anvil-api.priority=20
      - traefik.http.routers.anvil-api.entrypoints=websecure
      - traefik.http.routers.anvil-api.tls=true
      - traefik.http.routers.anvil-api.tls.certresolver=letsencrypt
      - traefik.http.routers.anvil-api.middlewares=anvil-auth
      - traefik.http.routers.anvil-api.service=anvil-api
      # /health — deliberately open, so liveness can be proven with a bare
      # curl and no credentials. Returns no data about the business.
      - traefik.http.routers.anvil-health.rule=Host(`factory.halovisionai.cloud`) && Path(`/health`)
      - traefik.http.routers.anvil-health.priority=30
      - traefik.http.routers.anvil-health.entrypoints=websecure
      - traefik.http.routers.anvil-health.tls=true
      - traefik.http.routers.anvil-health.tls.certresolver=letsencrypt
      - traefik.http.routers.anvil-health.service=anvil-api
      # Password is a 24-char random string, bcrypt-hashed; `$$` is compose's
      # escape for a literal `$`. Rotate by regenerating this hash.
      - traefik.http.middlewares.anvil-auth.basicauth.users=anvil:$$2b$$10$$e1YMp9o3YByrCJoMrLi5a.BBE4PzZXyQ6q56JUVne4McVnKgOlL3O
    mem_limit: 384m

  celery_worker:
    image: ghcr.io/breezybuddy69/ai-company-backend:latest
    container_name: factory-celery-worker
    restart: unless-stopped
    networks:
      - internal
    # 8 slots, not 4. An agent run is one HTTP call and a long wait, so these
    # are almost entirely idle — the limit that bites is the free-model rate
    # limit, not this box. Raising it further mostly buys more 429s and more
    # fallbacks down model_registry.yaml.
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO", "--concurrency=8"]
    environment:
      DATABASE_URL: postgresql+psycopg://factory:CHANGE_ME_STRONG_PASSWORD@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ""
      BROWSERLESS_URL: http://browserless:3000
      BROWSERLESS_TOKEN: "CHANGE_ME_STRONG_TOKEN"
    volumes:
      - agent_configs:/agents/configs
    depends_on:
      - postgres
      - redis
    mem_limit: 768m

  celery_beat:
    image: ghcr.io/breezybuddy69/ai-company-backend:latest
    container_name: factory-celery-beat
    restart: unless-stopped
    networks:
      - internal
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://factory:CHANGE_ME_STRONG_PASSWORD@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
    volumes:
      - agent_configs:/agents/configs
    depends_on:
      - postgres
      - redis
    mem_limit: 128m

  dashboard:
    image: ghcr.io/breezybuddy69/ai-company-dashboard:latest
    container_name: factory-dashboard
    restart: unless-stopped
    networks:
      - internal
      - traefik-proxy
    environment:
      # Second, independent gate (dashboard/middleware.ts), read at request
      # time so it needs no rebuild. Redundant with the Traefik basicauth
      # above — left blank by default so you get one login prompt, not two.
      DASHBOARD_USER: ""
      DASHBOARD_PASSWORD: ""
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.services.anvil-dash.loadbalancer.server.port=3000
      - traefik.http.routers.anvil-dash.rule=Host(`factory.halovisionai.cloud`)
      - traefik.http.routers.anvil-dash.priority=10
      - traefik.http.routers.anvil-dash.entrypoints=websecure
      - traefik.http.routers.anvil-dash.tls=true
      - traefik.http.routers.anvil-dash.tls.certresolver=letsencrypt
      - traefik.http.routers.anvil-dash.middlewares=anvil-auth
      - traefik.http.routers.anvil-dash.service=anvil-dash
    mem_limit: 256m

  # Internal only — the backend reaches it at http://browserless:3000. Never
  # publish this: an unauthenticated headless Chrome is a remote browser for
  # whoever finds it.
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: factory-browserless
    restart: unless-stopped
    networks:
      - internal
    environment:
      TOKEN: "CHANGE_ME_STRONG_TOKEN"
      MAX_CONCURRENT_SESSIONS: "2"
      TIMEOUT: "60000"
    mem_limit: 1024m

networks:
  internal:
    driver: bridge
  # Must already exist and must be the network the running Traefik is attached
  # to. Verify with `docker network ls` — if the live Traefik uses a different
  # name, change it in all three places here rather than creating a second one.
  traefik-proxy:
    external: true

volumes:
  postgres_data:
  agent_configs:

# The n8n service that used to live here is gone: n8n.halovisionai.cloud is
# already running and is what the orchestration actually targets. Two n8n
# instances meant 256MB and a second set of credentials for nothing. The old
# n8n_data volume is left untouched on the host, so nothing is lost if that
# instance did hold workflows — check it before pruning volumes.
