# Free-first AI model routing registry.
#
# The model_router (backend/app/core/model_router.py) tries entries strictly in
# ascending `priority` order. Any failure — HTTP error, rate limit, timeout,
# "model not found" — is treated the same way: log it and fall through to the
# next entry. This means exact OpenRouter slugs going stale (models get
# renamed/retired often) degrades gracefully instead of breaking the system.
#
# This file is the single source of truth for routing. Editing it never
# requires a code change or redeploy of application logic — only a container
# restart to reload it (or hit POST /api/models/reload once that's wired up).
#
# Verify current free-tier slugs against https://openrouter.ai/models?max_price=0
# before relying on a specific one long-term — they change over time.

router:
  # Absolute ceiling: the router will NEVER select a model whose prompt or
  # completion price per token is above this, regardless of what's in the
  # list below. Keeps the "free-first" promise enforced in code, not just by
  # convention.
  max_cost_per_1k_tokens_usd: 0.0
  request_timeout_seconds: 60
  max_retries_per_model: 2
  # After this many consecutive failures within the cooldown window, a model
  # is skipped for the rest of the window instead of retried every call.
  failure_cooldown_seconds: 300
  consecutive_failures_before_cooldown: 3

models:
  # No "openrouter/auto" entry: that meta-model lets OpenRouter itself pick
  # the backing model per-request, which can be a paid one (that's exactly
  # what burned real money here — it was tried first, always "succeeded",
  # and every genuinely-free model below never got a chance). Only list
  # models with an explicit ":free" slug — that suffix is an OpenRouter
  # pricing guarantee, unlike a declared `cost: 0` on a dynamic router.
  # Every slug below was live-tested against OpenRouter on 2026-07-29 and
  # returned HTTP 200 with usage.cost == 0. The previous list (DeepSeek, Qwen
  # 2.5, GLM-4, Kimi K2, Llama 3.3, Gemini 2.0 Flash) was ENTIRELY stale by
  # then — all 7 slugs 404'd, so every routed call fell through the whole list
  # and failed. That is why openrouter/auto appeared to be the only thing that
  # worked, and why removing it in ac10896 left nothing behind it. Re-verify
  # with `scripts/verify_models.py` before assuming this list still holds.
  - name: "nvidia/nemotron-3-super-120b-a12b:free"
    provider: openrouter
    display_name: "Nemotron 3 Super 120B (free)"
    cost: 0
    capability: general
    priority: 1

  - name: "nvidia/nemotron-3-ultra-550b-a55b:free"
    provider: openrouter
    display_name: "Nemotron 3 Ultra 550B (free, 1M ctx)"
    cost: 0
    capability: reasoning
    priority: 2

  - name: "cohere/north-mini-code:free"
    provider: openrouter
    display_name: "Cohere North Mini Code (free)"
    cost: 0
    capability: coding
    priority: 3

  - name: "poolside/laguna-s-2.1:free"
    provider: openrouter
    display_name: "Poolside Laguna S 2.1 (free)"
    cost: 0
    capability: coding
    priority: 4

  # Priority 5 intentionally vacant: google/gemma-4-31b-it:free was dropped
  # after it returned "Provider returned error" on one of two probe runs.
  # A flaky entry costs a wasted round-trip per call and makes the
  # verify_models.py deploy gate cry wolf; the router has depth without it.
  - name: "inclusionai/ling-3.0-flash:free"
    provider: openrouter
    display_name: "Ling 3.0 Flash (free)"
    cost: 0
    capability: general
    priority: 6

  - name: "nvidia/nemotron-3-nano-30b-a3b:free"
    provider: openrouter
    display_name: "Nemotron 3 Nano 30B (free)"
    cost: 0
    capability: general
    priority: 7

  - name: "google/gemma-4-26b-a4b-it:free"
    provider: openrouter
    display_name: "Gemma 4 26B A4B IT (free)"
    cost: 0
    capability: general
    priority: 8

  - name: "nvidia/nemotron-nano-9b-v2:free"
    provider: openrouter
    display_name: "Nemotron Nano 9B v2 (free)"
    cost: 0
    capability: general
    priority: 9

  - name: "poolside/laguna-xs-2.1:free"
    provider: openrouter
    display_name: "Poolside Laguna XS 2.1 (free)"
    cost: 0
    capability: coding
    priority: 10

# Local, zero-cost embedding model (not routed through OpenRouter — runs
# on-box via sentence-transformers). Used by core/memory.py for pgvector.
embedding:
  provider: local
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: 384
